name: CI

on:
  push:
    branches: [main, 'kernel-*']
  pull_request:
  # A merge queue runs the required checks on the merged result.
  merge_group:
  workflow_dispatch:
  # The kernel gate (tools/kernel_gate.sh): every kernel test, known failures included; too slow
  # for each push.
  schedule:
    - cron: '17 2 * * *'

concurrency:
  # A push doesn't cancel the nightly gate.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the cached target folder small: no incremental state, less debug info.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Per push and pull request: every crate is rustfmt-clean (default style; run `cargo fmt --all`,
  # and `cargo fmt` in site/, before committing). Mark "Format" as a required status check too.
  fmt:
    name: Format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install && cargo fmt --version

      - name: cargo fmt (workspace)
        run: cargo fmt --all --check

      # site/ is its own workspace on its own toolchain (site/rust-toolchain.toml).
      - name: cargo fmt (site)
        working-directory: site
        run: rustup toolchain install && cargo fmt --check

  # Per push and pull request: the kernel's builds without the test feature, its clippy gate and
  # a fast subset of the gate (tools/kernel_gate.sh: the unit tests, conformance, smlib_booleans,
  # validity, determinism and every 4th runnable case of OCCT's boolean suite, generated from
  # OCCT's test scripts without the dataset, classified as the nightly gate does: a regression,
  # a stale or panicking known failure, a hang or a crash fails it); any failed step fails the
  # job. It is the merge requirement for main and kernel-10: mark "Kernel (checks, clippy, fast
  # gate)" as a required status check in both branches' protection rules (Settings > Branches),
  # with "Build and test (Linux)" for main.
  kernel:
    name: Kernel (checks, clippy, fast gate)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold

      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel

      # The library without the tests' `testkit` feature (every test enables it), and the
      # kernel's real consumer.
      - name: Check (kernel without features, cadrs_core)
        run: cargo check -p cadrs_kernel && cargo check -p cadrs_core

      # The kernel is kept clippy-clean (warnings denied; lint levels in its Cargo.toml).
      - name: Clippy (kernel)
        run: tools/kernel_clippy.sh

      - name: OCCT test scripts (7.8.1)
        run: |
          git clone --depth 1 --branch V7_8_1 --filter=blob:none --sparse \
            https://github.com/Open-Cascade-SAS/OCCT "$GITHUB_WORKSPACE/../occt"
          git -C "$GITHUB_WORKSPACE/../occt" sparse-checkout set tests/boolean
          python3 -I tools/occt_to_rust.py "$GITHUB_WORKSPACE/../occt/tests" crates/cadrs_kernel/tests boolean

      # The checks ran above (--no-checks); the slice of occt_boolean is the same cases each run.
      - name: Fast gate (lib, conformance, smlib_booleans, validity, determinism, occt_boolean 1 in 4)
        env:
          RUST_TEST_THREADS: 4
        run: |
          tools/kernel_gate.sh --tree . --commit "$GITHUB_SHA" --out "$GITHUB_WORKSPACE/kernel_gate" \
            --no-checks --only lib,conformance,smlib_booleans,validity,determinism,occt_boolean \
            --sample occt_boolean=4 --hang 600

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-fast-gate
          path: |
            kernel_gate/results.json
            kernel_gate/summary.txt
            kernel_gate/stderr.log

  # Nightly, for main and kernel-10: tools/kernel_gate.sh on a clean export of the branch, with
  # OCCT's DRAW suites regenerated from OCCT 7.8.1's test scripts and its 7.8.0 dataset, and every
  # kind of ignored test run that can be. Fails on a failed check, a regression, a stale known
  # failure or ignore, a hang, a crash, or a case much slower than the branch's last passing run
  # (its durations are the baseline, kept in the Actions cache). results.json is the
  # scoreboard's input: `gh run download -n kernel-gate-<branch>`, then
  # `tools/kernel_scoreboard.py --results results.json`; the job summary shows it too.
  kernel-gate:
    name: Kernel gate (nightly, ${{ matrix.ref }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'schedule' && fromJSON('["main", "kernel-10"]') || fromJSON(format('["{0}"]', github.ref_name)) }}
    env:
      OCCT_TESTS: ${{ github.workspace }}/../occt/tests
      CADRS_OCCT_DATA: ${{ github.workspace }}/../occt-dataset/opencascade-dataset-7.8.0
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold

      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel-gate

      - name: OCCT test scripts (7.8.1)
        run: |
          git clone --depth 1 --branch V7_8_1 --filter=blob:none --sparse \
            https://github.com/Open-Cascade-SAS/OCCT "$GITHUB_WORKSPACE/../occt"
          git -C "$GITHUB_WORKSPACE/../occt" sparse-checkout set tests

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../occt-dataset
          key: occt-dataset-7.8.0

      - name: OCCT dataset (7.8.0)
        run: |
          if [ ! -d "$CADRS_OCCT_DATA" ]; then
            mkdir -p "$GITHUB_WORKSPACE/../occt-dataset"
            curl -fsSL https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_8_0/opencascade-dataset-7.8.0.tar.xz \
              | tar -xJ -C "$GITHUB_WORKSPACE/../occt-dataset"
          fi
          ls "$CADRS_OCCT_DATA" | head

      # The durations of the branch's last passing gate run.
      - name: Baseline (restore)
        uses: actions/cache/restore@v4
        with:
          path: kernel_gate_baseline
          key: kernel-gate-baseline-${{ matrix.ref }}-${{ github.run_id }}
          restore-keys: kernel-gate-baseline-${{ matrix.ref }}-

      - name: Kernel gate
        run: |
          mkdir -p kernel_gate_baseline
          tools/kernel_gate.sh --out "$GITHUB_WORKSPACE/kernel_gate" \
            --baseline kernel_gate_baseline/baseline.json --write-baseline kernel_gate_baseline/baseline.json

      - name: Baseline (save)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: kernel_gate_baseline
          key: kernel-gate-baseline-${{ matrix.ref }}-${{ github.run_id }}

      - name: Scoreboard
        if: always()
        run: |
          {
            echo '```'
            python3 -I tools/kernel_scoreboard.py --results "$GITHUB_WORKSPACE/kernel_gate/results.json" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-gate-${{ matrix.ref }}
          path: |
            kernel_gate/results.json
            kernel_gate/summary.txt
            kernel_gate/stderr.log

  test:
    name: Build and test (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config clang mold \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # The nightly pinned in rust-toolchain.toml (.cargo/config.toml links with mold and uses a
      # nightly flag).
      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      # OpenCASCADE is built from source on the first run (several minutes); the cache keeps it.
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      # Unit tests only: each integration test (`crates/*/tests`) links Bevy and OpenCASCADE into
      # its own large binary, too much for a hosted runner's disk. Run them locally with
      # `cargo test --workspace`.
      - name: Test
        run: cargo test --workspace --exclude cadrs --lib

  # The browser build (tools/web) compiles: code that also runs in a page reads files through
  # cadrs_fs, tells the time with web_time and starts no threads (CLAUDE.md), which a native build
  # can't check.
  web:
    name: Check (browser)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # clang and mold link the build scripts (.cargo/config.toml's host settings).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold

      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      # With tools/web/build.sh's features.
      - name: Check
        run: cargo check --locked --target wasm32-unknown-unknown -p cadrs --no-default-features -F gpu

  macos:
    name: Build and test (macOS)
    if: github.event_name != 'schedule'
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: brew install cmake

      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace --exclude cadrs --lib
